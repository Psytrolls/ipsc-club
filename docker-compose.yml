services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: desert-falcon:latest
    container_name: desert-falcon-ipsc
    restart: unless-stopped
    ports:
      - "3080:3000"
    environment:
      - NODE_ENV=production
      - APP_ORIGIN=https://ipsc.magavnegev.co.il
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - PRIVATE_OWNER_SETUP=1
    volumes:
      - ./data:/app/data

  # OPTIONAL: Cloudflare Tunnel (Recommended for TrueNAS without port forwarding)
  # Uncomment if you use a Cloudflare Tunnel token:
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: ipsc-tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
  #   depends_on:
  #     - app
