services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: desert-falcon:latest
    container_name: desert-falcon-ipsc
    restart: unless-stopped
    ports:
      - "3080:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DF_DATA_DIR=/app/data
      - DF_TRUST_PROXY=1
      - DF_SECURE_COOKIES=0
    volumes:
      - ./data:/app/data

  # OPTIONAL: Cloudflare Tunnel (if running inside docker instead of TrueNAS app/host)
